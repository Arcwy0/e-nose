[build-system]
requires = ["setuptools==75.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enose"
version = "3.2.1"
dynamic = ["optional-dependencies"]
description = "Vision + smell multimodal understanding for a Unitree Go-1 e-nose rig"
readme = { text = "E-Nose: Florence-2 vision + 22-feature smell classifier (FastAPI server + interactive client).", content-type = "text/plain" }
requires-python = ">=3.9"
authors = [{ name = "Sense" }]
license = {text = "MIT"}

# Base deps are the light, universally-wheel-available packages both the client
# and server share. Everything with a version pin that historically fails to
# build on a fresh Windows Python (numpy<2, scikit-learn<1.6) or that only the
# server needs (fastapi/uvicorn) lives in the `server` extra, so a client-only
# install (`pip install "enose[client]"`) stays lightweight and pip can resolve
# it entirely from prebuilt wheels. Heavy ML deps (torch, transformers,
# imbalanced-learn, xgboost) live in the Docker image / the extras below.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0,<3.0",
    "pillow>=10.0",
    "requests>=2.31",
]

[tool.setuptools.dynamic.optional-dependencies]
# Exact direct pins are shared with requirements/server-lock.txt. Install the
# complete lock via requirements-server.txt before `pip install --no-deps -e .`
# or `uv pip install --no-deps -e .` for identical transitive versions as Docker.
server = {file = ["requirements/server.in", "requirements/vision.in", "requirements/classifier.in"]}
vision = {file = ["requirements/vision.in"]}
classifier-extras = {file = ["requirements/classifier.in"]}
client = {file = ["requirements/client.in"]}
dev = {file = ["requirements/dev.in"]}

[project.scripts]
enose-server = "enose.server.app:app"
enose-client = "enose.client.main:main"

[tool.setuptools.packages.find]
include = ["enose*"]
exclude = ["tests*", "scripts*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv.pip]
# Match pip's selection across PyPI and the CUDA wheel index in the shared lock.
# Torch's exact +cu124 pin still forces the correct backend on both OSes.
index-strategy = "unsafe-best-match"
